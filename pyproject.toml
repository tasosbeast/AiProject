[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-personal-assistant"
version = "0.1.0"
description = "A safe, deterministic foundation for a personal Windows desktop assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Owner" }]
dependencies = []

[project.optional-dependencies]
gui = [
  "PySide6>=6.8,<7.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
]

[project.scripts]
windows-assistant = "desktop_assistant.cli:main"

[project.gui-scripts]
windows-assistant-gui = "desktop_assistant.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
